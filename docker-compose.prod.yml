# Compose file untuk production di VPS. HANYA berisi service aplikasi (api, web) --
# SENGAJA TIDAK membuat service Postgres baru: CLAUDE.md (§ Rencana infra VPS) sudah
# memutuskan pakai INSTANCE Postgres yang SUDAH JALAN di VPS, database baru `samsara`
# dibuat DI DALAM instance itu -- bukan instance terpisah. Begitu juga n8n dan VNC
# desktop TIDAK disentuh sama sekali oleh file ini.
#
# SUDAH DIVERIFIKASI LANGSUNG DI VPS (2026-10-16/17, diagnostik Tahap A):
#   - Nama container Postgres sungguhan: `n8n-stack-postgres-1` (bukan `postgres`).
#   - Network Docker yang dipakainya: `n8n-stack_default` -- ini nilai EXISTING_NETWORK_NAME
#     yang benar (lihat default di bawah, sudah diisi sesuai temuan, bukan placeholder lagi).
#   - Network itu sudah punya DNS alias internal "postgres" untuk container itu (dikonfirmasi
#     lewat `docker inspect`), jadi DB_HOST tetap bisa pakai "postgres" (default di bawah)
#     tanpa perlu container app ini tahu nama container panjangnya.
#   - web di-bind ke 127.0.0.1:8080 (match persis dengan proxy_pass di server block nginx
#     host-level untuk burnas-app.duckdns.org) -- api TIDAK di-expose ke host sama sekali.
#   - Pastikan database `samsara` SUDAH dibuat (CREATE ROLE + CREATE DATABASE lewat
#     `docker exec` ke n8n-stack-postgres-1) SEBELUM container `api` start.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: samsara-api:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-samsara}
      PORT: 4000
    networks:
      - default
      - existing_vps_network
    deploy:
      resources:
        # Diperketat dari draft awal (512M/128M) -- RAM bebas VPS cuma ~350MB
        # saat diagnostik (lihat devops/README.md). 256M cukup untuk Express +
        # pg pool kecil, jauh di atas footprint idle realistis (~60-100MB).
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: samsara-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Cuma web yang perlu nyambung ke luar (lewat Nginx Proxy Manager) -- api
      # TIDAK di-expose ke luar sama sekali, cuma bisa diakses dari network internal
      # compose ini (lewat proxy /api di nginx.conf milik image web).
      - "127.0.0.1:8080:80"
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 16M

networks:
  default:
  # Network Docker yang SUDAH ADA di VPS, dipakai container Postgres existing
  # (n8n-stack-postgres-1) -- dikonfirmasi lewat `docker inspect` 2026-10-16/17.
  existing_vps_network:
    external: true
    name: ${EXISTING_NETWORK_NAME:-n8n-stack_default}
