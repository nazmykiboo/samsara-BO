# Proxy /api dan /health ke service "api" (nama service di docker-compose.prod.yml)
# supaya frontend & backend satu origin dari sudut pandang browser -- menjawab
# catatan "belum diputuskan" di vite.config.ts (dev proxy ke localhost:4000 untuk
# alasan yang sama: backend tidak punya header CORS sama sekali). Pola proxy ini
# PERSIS meniru proxy dev server, cuma pindah dari Vite ke Nginx untuk production.
server {
  listen 80;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api:4000;
  }

  # SPA: semua route non-file (react-router) jatuh ke index.html.
  location / {
    try_files $uri /index.html;
  }
}
